# _quarto.yml
# Configuration generale du site.

project:
  type: website
  output-dir: _site

  # Par defaut Quarto rend TOUS les .qmd ET les .md du repertoire, donc
  # PROJET-REPLICATION.md devenait une page publique indexee dans la recherche.
  # Le site n'est fait que de .qmd : on restreint a ca. Tout document de travail
  # en .md reste invisible, meme s'il finit commite par accident.
  render:
    - "**/*.qmd"

  # L'image de partage n'est referencee par aucune page : sans cette ligne,
  # Quarto ne la copie pas dans _site.
  resources:
    - assets/og-default.png

website:
  title: "Eliot Bochet-Merand"
  description: "Economics of immigration and technical change"
  site-url: "https://eliot-bm.github.io"

  # Carte de partage par defaut. Une page qui a son propre `image:` la remplace.
  # Generee par R/decor/make_og.R (1200 x 630).
  open-graph: true
  twitter-card: true
  image: /assets/og-default.png
  image-alt: "Eliot Bochet-Merand, PhD candidate in economics, Paris Nanterre University. Five flat colour bars on an ivory ground."

  navbar:
    # Ordre = hierarchie de tes priorites. Working papers avant tout le reste.
    # Les libelles changent, pas les dossiers : research/ et notes/ gardent leur
    # adresse, donc aucun lien entrant ne casse.
    left:
      - href: index.qmd
        text: Home
      - href: research/index.qmd
        text: Working papers
      - href: teaching/index.qmd
        text: Teaching
      - href: notes/index.qmd
        text: Blog
      - href: cv/index.qmd
        text: CV
    right:
      - icon: github
        href: https://github.com/Eliot-bm
        aria-label: GitHub

  page-footer:
    # Credit : les planches de 1900 sont l'oeuvre d'une equipe, pas d'un homme.
    left: "Visual identity after the data portraits made by W.E.B. Du Bois and his team of Atlanta University students and alumni for the 1900 Paris Exposition. Decorative figures drawn from Insee data (Licence Ouverte 2.0)."
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    # brand = applique _brand.yml. styles.scss = les quelques reglages en plus.
    theme: [brand, styles.scss]
    toc: false
    anchor-sections: true
    link-external-newwindow: true

execute:
  # auto = re-execute le code SEULEMENT si le .qmd a change.
  # Indispensable : sans ca, GitHub ne pourrait pas construire le site
  # (il n'a ni ton R, ni tes donnees CASD).
  freeze: true
  
